<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1116">
  <meta name="color-scheme" content="dark">
  <title>Lancelot</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/iconos/icono-192.png">
  <link rel="apple-touch-icon" href="/iconos/icono-180.png">
  <link rel="preload" href="/fuentes/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/estilos.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="cabecera">
    <canvas id="cara" class="cara" role="button" tabindex="0" aria-label="Tócame y te digo una frase"></canvas>
    <p id="dice" class="burbuja" role="status" aria-live="polite">Hola, Miguel.</p>
    <button id="b-ajustes" class="b-icono" aria-label="Ajustes" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.7 7.7 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>
    </button>
  </header>

  <!-- Primera vez: conectar este celular con tu servidor -->
  <main id="conectar" class="conectar" hidden>
    <form id="f-conectar">
      <label for="clave">Clave de Lancelot</label>
      <input id="clave" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required
             placeholder="Ejemplo: k7m2p-x9qrt-4hvwe-a8sdn">
      <button class="b-principal" type="submit">Conectar este celular</button>
      <p class="nota">Si escaneaste el código QR, no hace falta: se conecta solo.</p>
    </form>
  </main>

  <main id="principal" class="principal" hidden>
    <div id="lista" class="lista"></div>
  </main>

  <footer id="redactar" class="redactar" hidden>
    <p id="vista" class="vista"></p>
    <form id="f-tarea" class="caja">
      <input id="entrada" type="text" autocomplete="off" enterkeyhint="send" maxlength="300"
             placeholder="mañana 8pm pagar la luz" aria-label="Tarea o pregunta para Lancelot">
      <button id="b-enviar" class="b-enviar" type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </footer>

  <!-- Hoja que sube desde abajo: acciones de una tarea, "¿para cuándo?", ajustes -->
  <div id="velo" class="velo" hidden></div>
  <section id="hoja" class="hoja" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden>
    <h2 id="hoja-titulo"></h2>
    <div id="hoja-cuerpo"></div>
  </section>
</body>
</html>
